# Monitor Sísmico Global - servicios del proyecto.
# Uso: cp .env.example .env  (ajustar contraseñas)  &&  docker compose up -d
# Servicios se agregan por capa: nifi (1), spark (2), postgres (3), grafana (5).
services:
  nifi:
    image: apache/nifi:2.7.2
    container_name: sismos-nifi
    ports:
      - "${NIFI_PORT:-8443}:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USER}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 2g
      TZ: America/Santo_Domingo
    volumes:
      # zona raw: entrada/ salida/ errores/ alertas/ (visible desde el Mac y desde Spark)
      - ./data/raw:/opt/nifi/datos
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_db:/opt/nifi/nifi-current/database_repository
      - nifi_ff:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_prov:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: sismos-postgres
    ports:
      - "${POSTGRES_PORT:-5433}:5432"   # 5433 en el host: 5432 suele estar ocupado por un Postgres local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./02_Codigo/almacenamiento/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  spark:
    build: ./02_Codigo/procesamiento
    image: sismos-spark:3.5
    container_name: sismos-spark
    profiles: ["jobs"]            # no arranca con "up"; se ejecuta con: docker compose run --rm spark
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATA_RAW: /data/raw
    volumes:
      - ./02_Codigo/procesamiento:/app
      - ./data:/data
    command: ["python", "/app/procesar_sismos.py"]

  grafana:
    image: grafana/grafana-oss:13.0.2
    container_name: sismos-grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"   # solo local: el acceso anonimo de Grafana es Admin
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sismos}
    volumes:
      - ./02_Codigo/visualizacion/provisioning:/etc/grafana/provisioning:ro
      - ./02_Codigo/visualizacion/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nifi_conf:
  nifi_db:
  nifi_ff:
  nifi_content:
  nifi_prov:
  nifi_state:
  pgdata:
