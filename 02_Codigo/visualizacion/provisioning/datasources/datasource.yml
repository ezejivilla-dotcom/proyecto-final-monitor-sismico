apiVersion: 1

datasources:
  - name: postgres-sismos
    type: postgres
    uid: postgres-sismos
    url: postgres:5432
    user: ${POSTGRES_USER}
    database: ${POSTGRES_DB}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: 'disable'
      postgresVersion: 1600
    isDefault: true
    editable: false
